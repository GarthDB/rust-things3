[advisories]
version = 2
ignore = [
    # Transitive dep via SQLx MySQL support; we don't use MySQL
    { id = "RUSTSEC-2023-0071", reason = "Transitive dep via SQLx MySQL; no fix available and MySQL not used" },
    # Transitive dep via SQLx MySQL binary protocol; not used
    { id = "RUSTSEC-2024-0363", reason = "Transitive dep via SQLx MySQL binary protocol; not used" },
    # Bundled SQLite via libsqlite3-sys 0.30, pinned by sqlx-sqlite 0.8.x; fix needs sqlx 0.9
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys pinned by sqlx 0.8; revisit on sqlx 0.9 upgrade" },
    # Transitive dep via indicatif; no safe upgrade available
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained; transitive via indicatif with no safe upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# ring uses a mix of ISC, MIT, and OpenSSL-licensed code
[[licenses.exceptions]]
allow = ["ISC", "MIT", "OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
