name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # TEMP: remove before PR

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: things3

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binaries
        run: |
          cargo build --release --target aarch64-apple-darwin --bin "$BINARY_NAME"
          cargo build --release --target x86_64-apple-darwin --bin "$BINARY_NAME"
        working-directory: apps/things3-cli

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create -output "dist/$BINARY_NAME" \
            "target/aarch64-apple-darwin/release/$BINARY_NAME" \
            "target/x86_64-apple-darwin/release/$BINARY_NAME"
          lipo -info "dist/$BINARY_NAME"

      - name: Sign and notarize
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: scripts/macos-sign-notarize.sh "dist/$BINARY_NAME"

      - name: Create release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }} # TEMP: remove before PR
          generate_release_notes: true
          files: dist/${{ env.BINARY_NAME }}
